---
### Start questionnaire
include:
  - introduction.yml
  - name_purpose.yml
---
### Start switch questions
include:
  - access.yml
  - reuse.yml
  - community.yml
---
### Start content questions
include:
  - attribution.yml
  - versioning.yml
  - license.yml
  - documentation.yml
  - sustainability.yml
  - risks.yml
  - dmp.yml
---
mandatory: True
question: |
  Software Management Plan
attachment code: |
  [user_smp, machine_smp, template_yml]
---
attachment:
  name: Human Readable Software Management Plan for `${ software_name }`
  filename: Software_Management_Plan-${ space_to_underscore(software_name) }-${ release_date.strftime('%y_%m_%d') }
  docx template file: SMP_decision_tree_template_4.docx
  valid formats:
  #  - md
    - docx
  description: For your own administration
  variable name: user_smp
---
### Save all user answers in a dictionary
### The text will be saved in a variable called `user_vars_string`
code: |
  import copy
  import json

  user_vars = copy.deepcopy(all_variables())
  del user_vars["url_args"]
  del user_vars["session_local"]
  del user_vars["user_local"]
  del user_vars["device_local"]

  user_vars_string = json.dumps(user_vars, sort_keys=True, indent=4)
---
attachment:
  name: Machine Readable SMP for `${ software_name }`
  filename: Machine_Readable_SMP_${ space_to_underscore(software_name) }
  valid formats:
    - md
  description: For automated analysis
  variable name: machine_smp
  content: ${ user_vars_string }
---
attachment:
  name: Input file for the NLeSC Python Template
  description: |
    When setting up a new Python project using the [NLeSC Copier Template](https://github.com/NLeSC/python-template), you can reuse information from the SMP to automatically answer some of the asked questions.

    1. Download the `copier_template_answers.yml` file by right-clicking the link below and selecting "Save Link As...".
    2. Install [copier](https://copier.readthedocs.io/en/stable/#installation)
    3. Open a terminal and navigate to where your answers file is downloaded
    4. Create a new project using the following command:
    `copier copy https://github.com/nlesc/python-template.git \`
    `<PATH/TO/DESTINATION> --data-file=copier_template_answers.yml`

    Be sure to replace `<PATH/TO/DESTINATION>` with the location of an empty or non-existing folder.
  filename: copier_template_answers
  variable name: template_yml
  raw: True
  content file: answers.yml
